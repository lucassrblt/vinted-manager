services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vm
      POSTGRES_PASSWORD: vm
      POSTGRES_DB: vm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vm"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vm:vm@db:5432/vm
      DATA_DIR: /data
      COOKIE_SECURE: "false"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  data:
